<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Summary | NIFTY Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a0f;--surface:#0a1320;--surface2:#0f1e30;--border:#1a3050;--accent:#00d4ff;--green:#00ff88;--red:#ff3355;--yellow:#ffd700;--orange:#ff9f43;--text:#e0f0ff;--muted:#6687a3;--dim:#314b65;--mono:'Share Tech Mono',monospace;--display:'Barlow Condensed',sans-serif;--body:'Rajdhani',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:var(--bg);background-image:radial-gradient(ellipse at 15% 0%,rgba(0,100,180,.1),transparent 48%),radial-gradient(ellipse at 90% 100%,rgba(0,212,255,.05),transparent 45%);color:var(--text);font-family:var(--body);overflow-x:hidden}body:before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.035) 2px,rgba(0,0,0,.035) 4px);pointer-events:none;z-index:3}
.page{max-width:1800px;margin:auto;padding:18px 20px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.brand{font:900 25px var(--display);letter-spacing:4px;color:var(--accent)}.brand small{display:block;font:9px var(--mono);color:var(--muted);letter-spacing:3px;margin-top:-2px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;padding:9px 16px;border:0;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);background:linear-gradient(135deg,#24516d,#00a8c7);color:#fff;cursor:pointer;font:700 12px var(--display);letter-spacing:2px;text-decoration:none}.btn:hover{filter:brightness(1.2)}
.glass{background:linear-gradient(135deg,rgba(10,19,32,.95),rgba(15,30,48,.76));border:1px solid var(--border);position:relative;overflow:hidden}.glass:before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,212,255,.03),transparent 60%);pointer-events:none}.panel{padding:16px}.title{font:700 12px var(--display);letter-spacing:4px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:14px}.title:before{content:'';width:3px;height:14px;background:var(--accent)}.title:after{content:'';height:1px;background:var(--border);flex:1}.message{font:12px var(--mono);color:var(--muted);margin-bottom:14px}.status{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px}.status-item{padding:12px;background:rgba(0,0,0,.25);border-left:3px solid var(--accent);min-width:0}.status-label{display:block;font:9px var(--mono);letter-spacing:2px;color:var(--muted);margin-bottom:7px}.status-value{font:15px var(--mono);color:var(--text);overflow-wrap:anywhere}.status-value.green{color:var(--green)}
.capture{margin-top:16px;padding:16px}.capture-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:12px}.capture-title{font:900 24px var(--display);letter-spacing:3px;color:var(--accent)}.capture-meta{font:11px var(--mono);color:var(--muted);line-height:1.8;text-align:right}.direction-up{color:var(--green)}.direction-down{color:var(--red)}.move-box{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}.move-stat{padding:8px 12px;background:rgba(0,0,0,.25);border-left:2px solid var(--yellow);font:12px var(--mono);color:var(--text)}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:980px;font-family:var(--mono);font-size:11px}.table th{text-align:left;color:var(--muted);font-size:9px;letter-spacing:1px;font-weight:400;padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}.table td{padding:10px 8px;border-bottom:1px solid rgba(26,48,80,.55);white-space:nowrap}.table tr:last-child td{border-bottom:0}.contract{font:700 14px var(--display);letter-spacing:1px}.ce{color:var(--green)}.pe{color:var(--red)}.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--yellow)}.setup{display:inline-block;padding:4px 7px;font-size:9px;letter-spacing:1px;border:1px solid currentColor}.long{color:var(--green)}.short{color:var(--red)}.cover{color:var(--yellow)}.unwind{color:var(--orange)}.neutral{color:var(--muted)}.empty{text-align:center;padding:42px;color:var(--muted);font:12px var(--mono);letter-spacing:1px}.error{color:var(--red)}
@media(max-width:760px){.page{padding:14px 10px}.topbar{align-items:flex-start;flex-direction:column}.status{grid-template-columns:repeat(2,minmax(0,1fr))}.status-item:last-child{grid-column:1/-1}.capture-head{flex-direction:column}.capture-meta{text-align:left}.capture-title{font-size:20px}}
</style>
</head>
<body>
<main class="page">
	<div class="topbar"><div class="brand">MARKET SUMMARY<small>NIFTY 50 OI + BID / ASK INTELLIGENCE</small></div><div class="actions"><a class="btn" href="/index.html">DASHBOARD</a><a class="btn" href="/pulsef.html">VIEWS PULSE</a></div></div>
	<section class="glass panel">
		<div class="title">Today's Opening Baseline</div>
		<div class="message" id="message">Loading saved summaries...</div>
		<div class="status">
			<div class="status-item"><span class="status-label">DATE</span><span class="status-value" id="date">--</span></div>
			<div class="status-item"><span class="status-label">MARKET OPEN TIME</span><span class="status-value" id="openTime">WAITING</span></div>
			<div class="status-item"><span class="status-label">OPEN NIFTY</span><span class="status-value" id="openSpot">--</span></div>
			<div class="status-item"><span class="status-label">SUMMARIES SAVED</span><span class="status-value green" id="count">0</span></div>
			<div class="status-item"><span class="status-label">LATEST EVENT</span><span class="status-value" id="latest">WAITING</span></div>
		</div>
	</section>
	<section id="captures"><div class="glass empty">// WAITING FOR MARKET OPEN SNAPSHOT</div></section>
</main>
<script>
const money=value=>`Rs ${Number(value||0).toFixed(2)}`;
const qty=value=>{const amount=Math.abs(Number(value)||0);if(amount>=10000000)return `${(amount/10000000).toFixed(2)} Cr`;if(amount>=100000)return `${(amount/100000).toFixed(2)} L`;if(amount>=1000)return `${(amount/1000).toFixed(1)} K`;return amount.toFixed(0)};
const signed=value=>{const number=Number(value)||0;return `${number>=0?'+':''}${number.toFixed(2)}`};
const setupClass=setup=>({"LONG BUILDUP":"long","SHORT BUILDUP":"short","SHORT COVERING":"cover","LONG UNWINDING":"unwind"}[setup]||'neutral');
const valueClass=value=>Number(value)>0?'up':Number(value)<0?'down':'flat';
function optionRow(option){const oiClass=valueClass(option.oiChange);const priceClass=valueClass(option.priceChange);return `<tr><td class="contract ${option.type==='CE'?'ce':'pe'}">${option.label}</td><td>${money(option.openingPrice)}<br><span class="${priceClass}">${money(option.currentPrice)} (${signed(option.priceChange)})</span></td><td>${qty(option.openingOi)}<br><span>${qty(option.currentOi)}</span></td><td class="${oiClass}">${signed(option.oiChange)}<br>${option.oiChange>=0?'+':''}${Number(option.oiChangePct||0).toFixed(2)}%</td><td>${Number(option.openingBidQty||0).toFixed(0)} / ${Number(option.openingAskQty||0).toFixed(0)}<br><span>${Number(option.currentBidQty||0).toFixed(0)} / ${Number(option.currentAskQty||0).toFixed(0)}</span></td><td>${Number(option.openingRatio||0).toFixed(3)}<br><span class="${valueClass(Number(option.currentRatio)-Number(option.openingRatio))}">${Number(option.currentRatio||0).toFixed(3)}</span></td><td><span class="setup ${setupClass(option.setup)}">${option.setup}</span></td></tr>`}
function render(pulse){const captures=Array.isArray(pulse?.captures)?pulse.captures:[];const opening=pulse?.opening;document.getElementById('date').textContent=pulse?.date||'--';document.getElementById('openTime').textContent=opening?`${opening.time} IST`:'WAITING FOR 09:15';document.getElementById('openSpot').textContent=opening?Number(opening.spot).toFixed(2):'--';document.getElementById('count').textContent=captures.length;const latest=captures[captures.length-1];document.getElementById('latest').textContent=latest?`#${latest.number} @ ${latest.toTime}`:'WAITING';document.getElementById('message').textContent=latest?`Saved on server: latest move ${latest.direction} ${Math.abs(Number(latest.movePoints)).toFixed(2)} points. Auto-refreshing every 5 seconds.`:opening?'Opening baseline saved. Waiting for the first +/-50 point move.':'Start the dashboard during market hours to capture the opening baseline.';const target=document.getElementById('captures');if(!captures.length){target.innerHTML=`<div class="glass empty">// ${opening?'WAITING FOR NIFTY +/-50 POINT MOVE':'WAITING FOR MARKET OPEN SNAPSHOT'}</div>`;return}target.innerHTML=[...captures].reverse().map(capture=>{const directionClass=capture.direction==='UP'?'direction-up':'direction-down';const duration=Math.floor((Number(capture.elapsedSeconds)||0)/60);const seconds=(Number(capture.elapsedSeconds)||0)%60;return `<article class="glass capture"><div class="capture-head"><div class="capture-title">SUMMARY #${capture.number} <span class="${directionClass}">${capture.direction}</span></div><div class="capture-meta">${capture.fromTime} IST &rarr; ${capture.toTime} IST<br>${duration}m ${seconds}s elapsed</div></div><div class="move-box"><div class="move-stat">NIFTY: ${Number(capture.fromSpot).toFixed(2)} &rarr; ${Number(capture.toSpot).toFixed(2)}</div><div class="move-stat">MOVE: <span class="${directionClass}">${signed(capture.movePoints)} POINTS</span></div><div class="move-stat">OI CHANGE IS PRIMARY SIGNAL</div></div><div class="table-wrap"><table class="table"><thead><tr><th>CONTRACT</th><th>PRICE: OPEN &rarr; MOVE</th><th>OI: OPEN &rarr; MOVE</th><th>OI CHANGE</th><th>BID / ASK QTY: OPEN &rarr; MOVE</th><th>B/A RATIO: OPEN &rarr; MOVE</th><th>CLASSIFICATION</th></tr></thead><tbody>${(capture.options||[]).map(optionRow).join('')}</tbody></table></div></article>`}).join('')}
async function load(){try{const response=await fetch('/api/market-pulse',{cache:'no-store'});const data=await response.json();if(!data.success)throw new Error(data.message||'Unable to load');render(data.marketPulse)}catch(error){document.getElementById('message').textContent='Summary data unavailable. Check server connection.';document.getElementById('message').classList.add('error')}}
load();setInterval(load,5000);
</script>
</body>
</html>
